name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm audit --omit=dev

      - name: Build using the configured public API
        env:
          VITE_DATA_SOURCE: ${{ vars.VITE_DATA_SOURCE || 'api' }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_MAPBOX_TOKEN: ${{ vars.VITE_MAPBOX_TOKEN }}
        run: |
          node -e "if(process.env.VITE_DATA_SOURCE==='api'){const u=new URL(process.env.VITE_API_URL);if(u.protocol!=='https:'||['localhost','127.0.0.1','::1'].includes(u.hostname))throw new Error('Configure a public HTTPS VITE_API_URL repository variable before deployment')}"
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
