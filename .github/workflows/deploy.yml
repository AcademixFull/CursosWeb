name: Verify Vercel deployment

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify published version and real data source
        env:
          # The immutable deployment URL may require Vercel authentication.
          # Check the public production alias without changing preview protection.
          DEPLOYMENT_URL: https://academix-web-three.vercel.app
        run: |
          node --input-type=module <<'NODE'
          const origin = new URL(process.env.DEPLOYMENT_URL);
          if (origin.protocol !== 'https:' || !origin.hostname.endsWith('.vercel.app')) {
            throw new Error('Expected an HTTPS Vercel deployment');
          }
          const response = await fetch(new URL('/build-info.json', origin), { signal: AbortSignal.timeout(30000), cache: 'no-store' });
          if (!response.ok) throw new Error(`build-info.json returned ${response.status}`);
          if (!response.headers.get('content-type')?.includes('application/json')) {
            throw new Error('The public production URL must return JSON, not a sign-in page');
          }
          const info = await response.json();
          if (info.dataSource !== 'api' || info.base !== '/' || !/^\d+\.\d+\.\d+/.test(info.version)) {
            throw new Error('Deployment must expose its version and use the real API from the root path');
          }
          console.log(`Academix Web ${info.version}: production configuration verified`);
          NODE
